project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!research.qmd"
  resources:
    - CNAME
    - .nojekyll
    - images/

website:
  title: "Mo Heidari"
  site-url: https://moheidari.com
  description: "Systematic trader and macro analyst based in London. Experience, projects and contact details."
  image: images/mo-heidari-portrait.jpg
  image-alt: "Portrait of Mo Heidari"
  open-graph:
    description: "Systematic trader and macro analyst based in London. Experience, projects and contact details."
    image: images/mo-heidari-portrait.jpg
    image-alt: "Portrait of Mo Heidari"
  twitter-card:
    description: "Systematic trader and macro analyst based in London. Experience, projects and contact details."
    image: images/mo-heidari-portrait.jpg
    image-alt: "Portrait of Mo Heidari"
    card-style: summary
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: contact.qmd
        text: Contact
  page-footer:
    center: "© 2026 Mo Heidari"

format:
  html:
    theme:
      light: [default, theme/common.scss, theme/light.scss]
      dark: [default, theme/common.scss, theme/dark.scss]
    respect-user-color-scheme: true
    toc: false
    include-in-header:
      text: '<meta name="description" content="Systematic trader and macro analyst based in London. Experience, projects and contact details.">'
